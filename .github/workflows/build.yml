name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write   # required only for publishing GitHub Releases on tags

env:
  SOLUTION: PS4wpfDumper.sln
  CONFIGURATION: Release
  PLATFORM: x64
  OUTPUT_DIR: PS4wpfDumper/bin/x64/Release
  APP_NAME: PS4Dumper

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.config') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore NuGet packages
        run: nuget restore ${{ env.SOLUTION }} -NonInteractive

      - name: Build (Release | x64)
        run: >
          msbuild ${{ env.SOLUTION }}
          /p:Configuration=${{ env.CONFIGURATION }}
          /p:Platform=${{ env.PLATFORM }}
          /m /nologo /verbosity:minimal

      - name: Stage distribution folder
        shell: pwsh
        run: |
          $dist = "dist"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item -Path "${{ env.OUTPUT_DIR }}/*" -Destination $dist -Recurse -Force
          # Runtime assembly probing expects dependencies in .\libs
          New-Item -ItemType Directory -Force -Path "$dist/libs" | Out-Null
          Copy-Item "PS4wpfDumper/libs/FluentFTP.dll" "$dist/libs/" -Force
          # Strip debug/doc leftovers
          Get-ChildItem $dist -Recurse -Include *.pdb,*.xml | Remove-Item -Force
          if (-not (Test-Path "$dist/${{ env.APP_NAME }}.exe")) { throw "Build output missing: ${{ env.APP_NAME }}.exe" }
          Get-ChildItem $dist -Recurse | Select-Object FullName, Length

      - name: Package ZIP
        shell: pwsh
        run: |
          $suffix = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { "build-${{ github.run_number }}" }
          $zip = "${{ env.APP_NAME }}-$suffix-win-x64.zip"
          Compress-Archive -Path "dist/*" -DestinationPath $zip -Force
          "ZIP_NAME=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-win-x64
          path: ${{ env.ZIP_NAME }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_NAME }}
          generate_release_notes: true
