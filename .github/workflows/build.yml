name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write   # required only for publishing GitHub Releases on tags

env:
  SOLUTION: PS4wpfDumper.sln
  CONFIGURATION: Release
  PLATFORM: x64
  OUTPUT_DIR: PS4wpfDumper/bin/x64/Release
  APP_NAME: PS4Dumper

jobs:
  build_goto_home:
    name: Build Goto Home one-shot payload
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install payload SDK build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 make unzip wget

      - name: Download PS4 Payload SDK
        run: |
          curl --fail --location --retry 3 --retry-delay 2 \
            https://github.com/ps4-payload-dev/sdk/releases/download/v0.9/ps4-payload-sdk.zip \
            --output ps4-payload-sdk.zip
          rm -rf "$GITHUB_WORKSPACE/ps4-payload-sdk"
          unzip -q ps4-payload-sdk.zip -d "$GITHUB_WORKSPACE"
          if [ ! -f "$GITHUB_WORKSPACE/ps4-payload-sdk/toolchain/orbis.mk" ]; then
            echo "PS4 Payload SDK archive contents:"
            unzip -l ps4-payload-sdk.zip | head -80
            echo "Expected toolchain/orbis.mk was not found."
            exit 1
          fi

      - name: Build Goto Home.bin
        run: |
          export PS4_PAYLOAD_SDK="$GITHUB_WORKSPACE/ps4-payload-sdk"
          make -C payloads/goto_home clean all
          test -s "payloads/goto_home/GotoHome.bin"
          mkdir -p payload-dist
          cp "payloads/goto_home/GotoHome.bin" "payload-dist/Goto Home.bin"

      - name: Upload Goto Home payload
        uses: actions/upload-artifact@v4
        with:
          name: Goto-Home-PS4-payload
          path: payload-dist/Goto Home.bin
          if-no-files-found: error
          retention-days: 30

  build_trampware:
    name: Build TrampWare GoldHEN plugin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PS4Dumper
        uses: actions/checkout@v4

      - name: Checkout TrampWare source
        uses: actions/checkout@v4
        with:
          repository: Plutana-eng-hash/Trampware
          ref: main
          path: Trampware

      - name: Checkout GoldHEN Plugins SDK
        uses: actions/checkout@v4
        with:
          repository: GoldHEN/GoldHEN_Plugins_SDK
          path: SDK

      - name: Checkout mxml
        uses: actions/checkout@v4
        with:
          repository: illusion0001/mxml
          ref: clang-14
          path: mxml

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y llvm lld make

      - name: Download OpenOrbis toolchain
        run: curl -fsSL https://github.com/illusion0001/OpenOrbis-PS4-Toolchain/releases/latest/download/toolchain.tar.gz | tar xz -C ./

      - name: Configure toolchain
        run: |
          echo "OO_PS4_TOOLCHAIN=$GITHUB_WORKSPACE/OpenOrbis/PS4Toolchain" >> "$GITHUB_ENV"
          echo "GOLDHEN_SDK=$GITHUB_WORKSPACE/SDK" >> "$GITHUB_ENV"

      - name: Install mxml dependency
        working-directory: mxml/ps4
        run: |
          wget -q https://raw.githubusercontent.com/bucanero/oosdk_libraries/master/build_rules.mk -O "$GITHUB_WORKSPACE/OpenOrbis/PS4Toolchain/build_rules.mk"
          make install PRX_BUILD=1

      - name: Build GoldHEN SDK
        run: make -C "$GITHUB_WORKSPACE/SDK" PRINTF=1 DEBUGFLAGS=1

      - name: Build TrampWare
        run: |
          mkdir -p plugin-dist
          mkdir -p Trampware/bin/plugins/prx_final Trampware/bin/plugins/elf_final
          make -C Trampware/plugin_src/trampware clean
          mkdir -p Trampware/bin/plugins/prx_final Trampware/bin/plugins/elf_final
          make -C Trampware/plugin_src/trampware DEBUG=0 PRINTF=1
          test -s Trampware/bin/plugins/prx_final/trampware.prx
          cp Trampware/bin/plugins/prx_final/trampware.prx plugin-dist/TrampWare.prx
          cp Trampware/bin/plugins/prx_final/trampware.prx plugin-dist/TrampWare.sprx

      - name: Upload TrampWare build
        uses: actions/upload-artifact@v4
        with:
          name: TrampWare-PS4-plugin
          path: plugin-dist/*
          if-no-files-found: error
          retention-days: 30

  build:
    needs: [build_trampware, build_goto_home]
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download TrampWare plugin
        uses: actions/download-artifact@v4
        with:
          name: TrampWare-PS4-plugin
          path: plugin-dist

      - name: Download Goto Home payload
        uses: actions/download-artifact@v4
        with:
          name: Goto-Home-PS4-payload
          path: payload-dist

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.config') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore NuGet packages
        run: nuget restore ${{ env.SOLUTION }} -NonInteractive

      - name: Clean WPF generated build files
        shell: pwsh
        run: |
          # MainWindow.xaml produces both generated connector code and BAML.
          # Remove both sides before compiling so their connection IDs cannot
          # come from different incremental-build generations.
          Get-ChildItem -Path . -Directory -Recurse -Force |
            Where-Object { $_.Name -in @("bin", "obj") } |
            Sort-Object { $_.FullName.Length } -Descending |
            ForEach-Object { Remove-Item $_.FullName -Recurse -Force -ErrorAction SilentlyContinue }

      - name: Build (Release | x64)
        run: >
          msbuild ${{ env.SOLUTION }}
          /t:Rebuild
          /p:Configuration=${{ env.CONFIGURATION }}
          /p:Platform=${{ env.PLATFORM }}
          /p:BuildProjectReferences=true
          /m /nologo /verbosity:minimal

      - name: Stage distribution folder
        shell: pwsh
        run: |
          $dist = "dist"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item -Path "${{ env.OUTPUT_DIR }}/*" -Destination $dist -Recurse -Force
          # Runtime assembly probing expects dependencies in .\libs
          New-Item -ItemType Directory -Force -Path "$dist/libs" | Out-Null
          Copy-Item "PS4wpfDumper/libs/FluentFTP.dll" "$dist/libs/" -Force
          New-Item -ItemType Directory -Force -Path "$dist/plugins" | Out-Null
          Copy-Item "plugin-dist/*" "$dist/plugins/" -Force
          New-Item -ItemType Directory -Force -Path "$dist/payloads" | Out-Null
          Copy-Item "payload-dist/Goto Home.bin" "$dist/payloads/Goto Home.bin" -Force
          # Strip debug/doc leftovers
          Get-ChildItem $dist -Recurse -Include *.pdb,*.xml | Remove-Item -Force
          if (-not (Test-Path "$dist/${{ env.APP_NAME }}.exe")) { throw "Build output missing: ${{ env.APP_NAME }}.exe" }
          Get-ChildItem $dist -Recurse | Select-Object FullName, Length

      - name: Package ZIP
        shell: pwsh
        run: |
          $suffix = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { "build-${{ github.run_number }}" }
          $zip = "${{ env.APP_NAME }}-$suffix-win-x64.zip"
          Compress-Archive -Path "dist/*" -DestinationPath $zip -Force
          "ZIP_NAME=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-main-dashboard-win-x64
          path: ${{ env.ZIP_NAME }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_NAME }}
          generate_release_notes: true
